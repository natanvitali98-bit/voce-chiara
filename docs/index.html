<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Voce Chiara">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Voce Chiara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: app a una colonna per iPhone, schede brevi, barra in basso con 5 sezioni */
:root{
  --bg:#edf1ef; --surface:#f8faf9; --line:#d3dcd8; --fg:#1d2a2c; --muted:#5b6a6c;
  --accent:#2c6b5a; --accent-soft:#d6e8e1; --warm:#c9821f; --warm-soft:#f6e6cc; --bad:#b0483b;
  --ff:"Lexend", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131a19; --surface:#1b2422; --line:#2c3a37; --fg:#e2eae7; --muted:#9aaba7;
  --accent:#6dc0a5; --accent-soft:#1f3a33; --warm:#e8ac55; --warm-soft:#3a2d18; --bad:#e58475; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131a19; --surface:#1b2422; --line:#2c3a37; --fg:#e2eae7; --muted:#9aaba7;
  --accent:#6dc0a5; --accent-soft:#1f3a33; --warm:#e8ac55; --warm-soft:#3a2d18; --bad:#e58475; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
html{overflow-anchor:none}
body{background:var(--bg);color:var(--fg);font-family:var(--ff);font-size:17px;line-height:1.6;letter-spacing:.01em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance;font-weight:600}
h1{font-size:1.6rem}
h2{font-size:1.2rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:600;background:var(--accent);color:var(--surface);min-height:52px;font-size:1rem}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--fg)}
.btn.wide{width:100%}
.btn.sm{min-height:40px;padding:8px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
textarea{min-height:90px;resize:vertical}
label{font-weight:500;font-size:.95rem}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav.tabs button{background:none;border:0;padding:8px 2px;border-radius:10px;font-size:.74rem;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

.hello{display:flex;flex-direction:column;gap:4px;padding-top:4px}
.big{font-size:2.2rem;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .4s}
.energy{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.energy button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 4px;font-weight:600;display:flex;flex-direction:column;gap:2px;align-items:center}
.energy button span{font-size:.75rem;font-weight:400;color:var(--muted)}
.plan{display:flex;flex-direction:column;gap:8px}
.pitem{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pitem:first-child{border-top:0}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--surface)}
.pitem.done .tick{background:var(--accent);border-color:var(--accent)}
.pitem.done .pn{color:var(--muted);text-decoration:line-through}
.pn{font-weight:600}
.tag{display:inline-block;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.w{background:var(--warm-soft);color:var(--warm)}
.note{background:var(--warm-soft);border-radius:14px;padding:14px 16px;font-size:.95rem}
.brain{border-color:var(--accent);border-width:1.5px}

.playbar{display:flex;flex-direction:column;gap:8px}
.playbar .row{justify-content:space-between}
.sentence{font-size:1.5rem;line-height:1.75;font-weight:500;display:flex;flex-wrap:wrap;gap:4px 14px;min-height:4.5em;align-content:flex-start}
.chunk{transition:opacity .25s, background .25s;border-radius:8px;padding:0 6px;margin:0 -6px}
.chunk.off{opacity:.13}
.chunk.cur{background:var(--warm-soft)}
.sep{color:var(--warm);font-weight:300}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:12px 4px;font-weight:600;min-height:56px}
.rate button[data-r="2"]{border-color:var(--accent)}
.rate button[data-r="0"]{border-color:var(--warm)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scaffold{display:flex;flex-direction:column;gap:8px}
.scaffold div{background:var(--bg);border-radius:10px;padding:10px 14px;font-size:1.08rem}
.scaffold div b{color:var(--accent)}
.clues{display:flex;flex-direction:column;gap:8px;counter-reset:c}
.clues div{background:var(--bg);border-radius:10px;padding:10px 14px;font-size:1.08rem;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.word{font-size:2.2rem;font-weight:600;text-align:center;color:var(--accent);padding:6px 0}
.forbid{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.forbid span{background:var(--warm-soft);color:var(--warm);padding:4px 12px;border-radius:8px;font-weight:600;text-decoration:line-through}
.timer{font-size:3rem;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;color:var(--accent)}
.timer.low{color:var(--warm)}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.flash{font-size:2.6rem;font-weight:600;text-align:center;min-height:2.2em;display:grid;place-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tiles button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 6px;font-weight:500;font-size:1.05rem;min-height:54px}
.tiles button.used{opacity:.3}
.answer{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:10px;border:1.5px dashed var(--line);border-radius:12px}
.answer span{background:var(--accent-soft);padding:4px 10px;border-radius:8px;font-weight:500}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:10px;border-radius:9px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ok{color:var(--accent);font-weight:600}
.no{color:var(--bad);font-weight:600}
.toggle{display:flex;align-items:center;gap:10px;font-size:.95rem}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}

.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.gcard b{font-size:1rem}
.gcard span{font-size:.82rem;color:var(--muted);line-height:1.4}

details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
summary{font-weight:600;cursor:pointer}
details ul{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px}

.result .it{font-size:1.35rem;font-weight:500;line-height:1.6}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;font-size:.95rem}
.pair span:nth-child(2){color:var(--warm)}
.dict{display:flex;flex-direction:column;gap:8px}
.dict .item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;border-top:1px solid var(--line);padding-top:10px}
.dict .d{color:var(--muted);font-size:.86rem}
.x{background:none;border:0;color:var(--muted);padding:6px 10px;font-size:.85rem}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-size:.86rem}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{padding:12px 14px;border-radius:14px;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--surface);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:1.45rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:.76rem;color:var(--muted);line-height:1.3}
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:110px;border-bottom:1px solid var(--line)}
.bars div{background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bars div.zero{background:var(--line)}
.bars div.today{background:var(--warm)}
.blabels{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-size:.66rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:30;max-width:calc(100% - 32px);animation:in .25s ease}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.btn.mic{background:var(--warm);color:var(--surface);display:flex;align-items:center;justify-content:center;gap:10px;min-height:62px;font-size:1.08rem}
.btn.mic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.btn.mic.rec{background:var(--bad);animation:pulse 1.2s ease-in-out infinite}
.btn.mic .dot{width:12px;height:12px;border-radius:50%;background:currentColor}
@keyframes pulse{50%{opacity:.72}}
.heard{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.login{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:18px}
/* ===== Grafica e animazioni (v17): il tema è la voce, onde e movimento leggero ===== */
:root{--shadow:0 1px 2px rgba(20,45,38,.06),0 10px 26px -16px rgba(20,45,38,.28);--shadow-press:0 1px 2px rgba(20,45,38,.08);--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.2,.9,.3,1.25)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--shadow:0 1px 2px rgba(0,0,0,.45),0 12px 28px -18px rgba(0,0,0,.7);--shadow-press:0 1px 2px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--shadow:0 1px 2px rgba(0,0,0,.45),0 12px 28px -18px rgba(0,0,0,.7);--shadow-press:0 1px 2px rgba(0,0,0,.5)}
body{background:radial-gradient(120% 60% at 100% -10%,var(--accent-soft) 0,transparent 55%),radial-gradient(90% 50% at -10% 0,var(--warm-soft) 0,transparent 50%),var(--bg);background-attachment:fixed}
.card,.gcard,details{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--line) 70%,transparent)}
.card{border-radius:20px}
.brain{border-color:var(--accent)}

/* entrata delle schermate: i blocchi salgono uno dopo l'altro */
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.enter>*{animation:rise .42s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}
.enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(6){animation-delay:.24s}.enter>*:nth-child(7){animation-delay:.28s}.enter>*:nth-child(n+8){animation-delay:.32s}

/* pulsanti: si schiacciano quando li tocchi */
.btn,.gcard,.rate button,.tiles button,.chips button,.energy button,.seg button,nav.tabs button,.x{transition:transform .14s var(--ease),background-color .2s,box-shadow .2s,border-color .2s,color .2s,opacity .2s}
.btn:active:not(:disabled),.gcard:active,.rate button:active,.tiles button:active,.chips button:active,.energy button:active{transform:scale(.96)}
.btn{box-shadow:var(--shadow-press)}
.btn:not(.ghost):not(.soft):not(.mic){background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,white),var(--accent))}
.gcard{border-radius:18px;position:relative;overflow:hidden}
.gcard::after{content:"";position:absolute;right:-18px;bottom:-18px;width:64px;height:64px;border-radius:50%;background:var(--accent-soft);opacity:.55;transition:transform .3s var(--ease)}
.gcard:active::after{transform:scale(1.4)}
.gcard>*{position:relative;z-index:1}
.rate button[data-r="2"]:active{background:var(--accent-soft)}
.rate button[data-r="0"]:active{background:var(--warm-soft)}

/* barra in basso: la voce attiva ha una "pillola" che compare */
nav.tabs{background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
nav.tabs button svg{transition:transform .25s var(--spring)}
nav.tabs button[aria-current="page"] svg{transform:translateY(-1px) scale(1.12)}
nav.tabs button[aria-current="page"]{animation:navpill .3s var(--spring)}
@keyframes navpill{from{background:transparent;transform:scale(.9)}}

/* Oggi: intestazione con l'onda della voce */
.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:6px 2px 0}
.wave{display:flex;align-items:center;gap:5px;height:56px}
.wave i{width:7px;border-radius:4px;background:linear-gradient(180deg,var(--warm),var(--accent));animation:wave 1.6s ease-in-out infinite;height:40%}
.wave i:nth-child(1){animation-delay:-.9s}.wave i:nth-child(2){animation-delay:-.6s}.wave i:nth-child(3){animation-delay:-.3s}
.wave i:nth-child(4){animation-delay:0s}.wave i:nth-child(5){animation-delay:-.45s}.wave i:nth-child(6){animation-delay:-.75s}.wave i:nth-child(7){animation-delay:-1.05s}
@keyframes wave{0%,100%{height:28%}50%{height:96%}}
.hero h1{font-size:1.75rem}

/* serie di giorni: fiammella */
.flame{width:30px;height:30px;align-self:center;transform-origin:50% 90%;animation:flicker 2.4s ease-in-out infinite}
.flame path:first-child{fill:var(--warm)}.flame path:last-child{fill:var(--warm-soft)}
@keyframes flicker{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.06)}}
.flame.off{animation:none;opacity:.35;filter:grayscale(1)}

/* barre che si riempiono */
@keyframes growX{from{width:0}}
.bar{height:12px;border-radius:6px}
.bar i{background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--warm)));animation:growX 1s var(--ease) both .15s}
@keyframes growY{from{transform:scaleY(0)}}
.bars div{transform-origin:bottom;animation:growY .7s var(--ease) both}
.steps i{transition:background .3s}
.steps i.on{animation:stepOn .4s var(--spring) both}
@keyframes stepOn{from{transform:scaleX(.3)}}

/* percorso: spunta che "scatta" */
.pitem.done .tick{animation:tickpop .45s var(--spring)}
@keyframes tickpop{0%{transform:scale(.4)}100%{transform:scale(1)}}

/* frase a pezzi: il pezzo attuale si accende */
.chunk{transition:opacity .35s var(--ease),background .35s,transform .35s var(--ease)}
.chunk.cur{transform:scale(1.04);box-shadow:inset 0 -3px 0 var(--warm)}
.chunk.off{transform:translateY(2px)}

/* memoria: ogni parola appare con un piccolo salto */
.flash{animation:pop .35s var(--spring)}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
.answer span,.msg,.heard,.note,.clues div{animation:pop .3s var(--spring) both}
.msg{box-shadow:var(--shadow-press)}
.word{animation:pop .4s var(--spring) both}

/* "il Cervello ci pensa": tre puntini che ondeggiano */
.spin{width:6px;height:6px;border:0;border-radius:50%;background:currentColor;color:var(--accent);margin:0 18px 0 2px;vertical-align:middle;
  box-shadow:9px 0 0 currentColor,18px 0 0 currentColor;animation:think 1s ease-in-out infinite}
.btn .spin,.msg.me .spin{color:inherit}
@keyframes think{0%,100%{transform:translateY(0);box-shadow:9px 0 0 currentColor,18px 0 0 currentColor}
  25%{transform:translateY(-4px);box-shadow:9px 4px 0 currentColor,18px 0 0 currentColor}
  50%{transform:translateY(0);box-shadow:9px -4px 0 currentColor,18px 0 0 currentColor}
  75%{transform:translateY(0);box-shadow:9px 0 0 currentColor,18px -4px 0 currentColor}}

/* microfono: anelli che si allargano e barre che seguono la tua voce */
.btn.mic{position:relative;overflow:visible;background:linear-gradient(180deg,color-mix(in srgb,var(--warm) 85%,white),var(--warm))}
.btn.mic.rec{background:linear-gradient(180deg,color-mix(in srgb,var(--bad) 85%,white),var(--bad));animation:none}
.btn.mic.rec::before,.btn.mic.rec::after{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid var(--bad);animation:ring 1.6s var(--ease) infinite;pointer-events:none}
.btn.mic.rec::after{animation-delay:.8s}
@keyframes ring{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(1.12,1.45)}}
.meter{display:inline-flex;align-items:center;gap:3px;height:22px}
.meter i{width:4px;height:100%;border-radius:2px;background:currentColor;transform:scaleY(.25);transition:transform .08s linear}
.meter.big{height:44px;gap:5px;justify-content:center;width:100%;color:var(--bad)}
.meter.big i{width:7px}

/* tempo di "Spiega senza dire": un anello che si svuota */
.tring{position:relative;width:132px;height:132px;margin:4px auto}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring circle{fill:none;stroke-width:10;stroke-linecap:round}
.tring .tbg{stroke:var(--line)}
.tring .tfg{stroke:var(--accent);stroke-dasharray:326.7;transition:stroke-dashoffset 1s linear,stroke .3s}
.tring.low .tfg{stroke:var(--warm)}
.tring .timer{position:absolute;inset:0;display:grid;place-items:center;font-size:2.6rem}

/* fine gioco: spunta disegnata e punti che volano */
.donecheck{width:84px;height:84px;margin:6px auto 0}
.donecheck circle{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5;stroke-dasharray:151;stroke-dashoffset:151;animation:draw .6s var(--ease) forwards}
.donecheck path{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s var(--ease) .45s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.endhead{text-align:center;align-items:center}
.pts{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:40;transform:translateX(-50%);font-weight:700;font-size:1.6rem;color:var(--warm);
  text-shadow:0 2px 0 var(--surface);pointer-events:none;animation:ptsUp 1.3s var(--ease) forwards}
@keyframes ptsUp{0%{opacity:0;transform:translate(-50%,16px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:39}

/* avviso in basso: sale dolcemente */
.toast{animation:toastIn .32s var(--spring);box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}

/* schermata di accesso */
.login .wave{height:80px;justify-content:center}
.login .wave i{width:9px}


/* ===== v18: Eco, colori dei giochi, strada del percorso ===== */
:root{--c-parlare:#2c6b5a;--c-parole:#2f6f9f;--c-memoria:#b8751a;--c-dialogo:#b4543f;--c-studio:#5b5fa8;--c-ripasso:#6d7f2e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-parlare:#6dc0a5;--c-parole:#79b4e0;--c-memoria:#e8ac55;--c-dialogo:#ec8f78;--c-studio:#a5a8ec;--c-ripasso:#b6c96f}}
:root[data-theme="dark"]{--c-parlare:#6dc0a5;--c-parole:#79b4e0;--c-memoria:#e8ac55;--c-dialogo:#ec8f78;--c-studio:#a5a8ec;--c-ripasso:#b6c96f}
.cat-parlare{--gc:var(--c-parlare)}.cat-parole{--gc:var(--c-parole)}.cat-memoria{--gc:var(--c-memoria)}.cat-dialogo{--gc:var(--c-dialogo)}.cat-studio{--gc:var(--c-studio)}.cat-ripasso{--gc:var(--c-ripasso)}.cat-mini{--gc:var(--warm)}

/* Eco: il personaggio del Cervello */
.eco{width:96px;height:88px;overflow:visible;flex:none}
.eco .shell{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.eco .eye{fill:var(--fg)}
.eco .shine{fill:var(--surface)}
.eco .cheek{fill:var(--warm);opacity:.35}
.eco .mouth{fill:none;stroke:var(--fg);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.eco .mouth.open{fill:var(--fg)}
.eco .waves path{fill:none;stroke:var(--warm);stroke-width:3;stroke-linecap:round;opacity:0}
.eco .dots circle{fill:var(--accent);opacity:0}
.eco .body{transform-box:fill-box;transform-origin:50% 100%;animation:bob 3.2s ease-in-out infinite}
.eco .eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.6s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.eco.think .pupils{animation:look 1.8s ease-in-out infinite}
@keyframes look{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
.eco.think .dots circle{animation:dotup 1.2s ease-in-out infinite}
.eco.think .dots circle:nth-child(2){animation-delay:.2s}.eco.think .dots circle:nth-child(3){animation-delay:.4s}
@keyframes dotup{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
.eco.happy .body{animation:jump .7s var(--spring) 3}
@keyframes jump{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-14px) scale(1.04,.96)}70%{transform:translateY(0) scale(1.06,.94)}}
.eco.listen .waves path{animation:wv 1.2s ease-out infinite}
.eco.listen .waves path:nth-child(2){animation-delay:.3s}
@keyframes wv{0%{opacity:0;transform:translateX(0)}40%{opacity:1}100%{opacity:0;transform:translateX(5px)}}
.eco.small{width:40px;height:37px}
.eco.big{width:132px;height:121px}

/* intestazione di Oggi con Eco e il suo fumetto */
.hero{grid-template-columns:auto 1fr;gap:14px}
.hero .say{background:var(--surface);border-radius:16px 16px 16px 4px;padding:10px 14px;box-shadow:var(--shadow);font-size:.95rem;line-height:1.45;position:relative;animation:pop .45s var(--spring) .25s both}
.hero .hello{gap:6px}

/* carte dei giochi: colore e icona propri */
.gicon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--gc) 16%,var(--surface));color:var(--gc);flex:none}
.gicon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.gcard[class*="cat-"]{background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 9%,var(--surface)) 0,var(--surface) 65%);border-color:color-mix(in srgb,var(--gc) 25%,var(--line))}
.gcard[class*="cat-"]::after{background:var(--gc);opacity:.1}
.gcard .tag{background:color-mix(in srgb,var(--gc) 14%,transparent);color:var(--gc)}
.gcard .gtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pitem{grid-template-columns:44px 1fr auto}
.pitem .gicon{width:40px;height:40px;border-radius:12px;position:relative}
.pitem.done .gicon{background:var(--accent);color:var(--surface)}
.pitem.done .gicon svg{display:none}
.pitem.done .gicon::after{content:"";width:16px;height:9px;border-left:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(-45deg) translate(1px,-2px);animation:tickpop .45s var(--spring)}
.playbar .gchip{display:inline-flex;align-items:center;gap:8px}
.playbar .gchip .gicon{width:30px;height:30px;border-radius:10px}
.playbar .gchip .gicon svg{width:17px;height:17px}

/* strada del percorso */
.road{display:grid;grid-template-columns:repeat(var(--n),1fr);position:relative;padding:8px 0 2px}
.road::before{content:"";position:absolute;left:calc(50%/var(--n));right:calc(50%/var(--n));top:26px;border-top:3px dashed var(--line)}
.road .fill{position:absolute;left:calc(50%/var(--n));top:25px;height:5px;border-radius:3px;background:var(--accent);animation:growX 1s var(--ease) both .2s}
.stop{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:1;text-align:center}
.stop .node{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface);border:3px solid var(--line);color:var(--muted);font-size:.9rem}
.stop.done .node{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.stop.now .node{border-color:var(--warm);color:var(--warm);box-shadow:0 0 0 0 var(--warm);animation:beacon 2s ease-out infinite}
@keyframes beacon{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--warm) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.stop span{font-size:.7rem;color:var(--muted);line-height:1.25;max-width:76px}
.stop.now span{color:var(--fg);font-weight:600}

/* chat: Eco accanto alle risposte */
.msg.ai{position:relative;margin-left:34px}
.msg.ai::before{content:"";position:absolute;left:-34px;bottom:0;width:26px;height:24px;background:var(--ecoMini) no-repeat center/contain}
.endhead .eco{margin:0 auto}
@media (prefers-reduced-motion:reduce){.wave i{height:60%}.meter i{transform:scaleY(.5)}}



/* ===== v19: stile moderno + sfera di luce al posto della mascotte ===== */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --line:#e4e8ee; --fg:#11181f; --muted:#5f6b77;
  --accent:#0e9f6e; --accent-soft:#dcf5ea; --warm:#f08c00; --warm-soft:#fff1da; --bad:#e5484d;
  --c-parlare:#0e9f6e; --c-parole:#2f7cf6; --c-memoria:#f08c00; --c-dialogo:#ef4f6b; --c-studio:#8457f0; --c-ripasso:#11a3b8;
  --on-accent:#ffffff;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px -6px rgba(16,24,40,.10);--shadow-press:none;
  --o1:#19c48e; --o2:#4c8dff; --o3:#ffb547;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0d10; --surface:#16191e; --line:#272c34; --fg:#eef1f5; --muted:#9aa5b1;
  --accent:#34d399; --accent-soft:#113528; --warm:#ffb224; --warm-soft:#382810; --bad:#ff6b70;
  --c-parlare:#34d399; --c-parole:#6aa8ff; --c-memoria:#ffb224; --c-dialogo:#ff7a90; --c-studio:#a88bff; --c-ripasso:#3fd0e0;
  --on-accent:#05130d; --shadow:0 0 0 1px #20252c; --o1:#2fe0a6; --o2:#5b9bff; --o3:#ffbf5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0d10; --surface:#16191e; --line:#272c34; --fg:#eef1f5; --muted:#9aa5b1;
  --accent:#34d399; --accent-soft:#113528; --warm:#ffb224; --warm-soft:#382810; --bad:#ff6b70;
  --c-parlare:#34d399; --c-parole:#6aa8ff; --c-memoria:#ffb224; --c-dialogo:#ff7a90; --c-studio:#a88bff; --c-ripasso:#3fd0e0;
  --on-accent:#05130d; --shadow:0 0 0 1px #20252c; --o1:#2fe0a6; --o2:#5b9bff; --o3:#ffbf5c; color-scheme:dark}

body{background:var(--bg);font-size:17px}

.card,.gcard,details{border:0;box-shadow:var(--shadow);background:var(--surface)}
.card{border-radius:24px;padding:20px}
details{border-radius:20px}
.brain{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 9%,var(--surface)),var(--surface) 60%)}

/* pulsanti puliti, senza sfumature */
.btn{border-radius:16px;box-shadow:none;font-weight:600}
.btn:not(.ghost):not(.soft):not(.mic){background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:color-mix(in srgb,var(--fg) 6%,transparent);color:var(--fg);border:0}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.mic{background:var(--warm);color:#fff}
.btn.mic.rec{background:var(--bad)}
.rate button,.energy button,.tiles button,.chips button{border:0;background:color-mix(in srgb,var(--fg) 5%,var(--surface));border-radius:14px}
.rate button[data-r="2"]{background:var(--accent-soft);color:var(--accent)}
.rate button[data-r="0"]{background:var(--warm-soft);color:var(--warm)}

input,textarea{border:0;background:color-mix(in srgb,var(--fg) 5%,var(--surface));border-radius:14px}
.tag,.tag.w{border-radius:999px;text-transform:none;letter-spacing:0;font-size:.75rem;padding:3px 10px}
.note{border-radius:16px}
.scaffold div,.clues div,.heard,.stat{background:color-mix(in srgb,var(--fg) 4%,var(--surface));border-radius:14px}
.msg.ai{background:color-mix(in srgb,var(--fg) 5%,var(--surface))}
.msg.me{background:var(--accent);color:var(--on-accent)}

/* giochi: tasselli pieni di colore con icona bianca */

.gicon{background:var(--gc,var(--accent));color:#fff;border-radius:14px}

.pitem{border-top:1px solid var(--line)}

/* barra in basso galleggiante */
nav.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border:0;border-radius:26px;padding:6px;
  background:color-mix(in srgb,var(--surface) 82%,transparent);box-shadow:0 8px 30px -8px rgba(16,24,40,.25),0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent)}

/* ===== la sfera di luce (Eco) ===== */
.eco{position:relative;width:72px;height:72px;flex:none;border-radius:50%;isolation:isolate;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0,rgba(255,255,255,0) 32%),radial-gradient(circle at 50% 50%,var(--o1),var(--o2) 78%);
  box-shadow:0 10px 30px -8px color-mix(in srgb,var(--o2) 60%,transparent),inset 0 -6px 14px rgba(0,0,0,.08);animation:breathe 4.5s ease-in-out infinite}
.eco i{position:absolute;inset:6%;border-radius:46% 54% 52% 48%/50% 44% 56% 50%;mix-blend-mode:screen;filter:blur(3px);opacity:.85}
.eco i:nth-child(1){background:radial-gradient(circle at 30% 70%,var(--o3),transparent 62%);animation:morph 7s ease-in-out infinite,orbit 11s linear infinite}
.eco i:nth-child(2){background:radial-gradient(circle at 75% 30%,var(--o1),transparent 60%);animation:morph 8s ease-in-out infinite reverse,orbit 14s linear infinite reverse}
.eco i:nth-child(3){background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.55),transparent 55%);animation:morph 9s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes morph{0%,100%{border-radius:46% 54% 52% 48%/50% 44% 56% 50%}33%{border-radius:58% 42% 40% 60%/44% 58% 42% 56%}66%{border-radius:40% 60% 58% 42%/58% 40% 60% 42%}}
.eco::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--o1);opacity:0;pointer-events:none}
.eco.think{animation:breathe 1.6s ease-in-out infinite}
.eco.think i:nth-child(1){animation-duration:2.2s,2.8s}.eco.think i:nth-child(2){animation-duration:2.6s,3.4s}
.eco.listen::after{animation:ripple 1.6s ease-out infinite}
@keyframes ripple{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
.eco.happy{animation:hop .6s var(--spring) 3,breathe 4.5s ease-in-out 1.8s infinite}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-12px) scale(1.06)}}
.eco.small{width:34px;height:34px}
.eco.big{width:112px;height:112px}
.endhead .eco{margin:6px auto 4px}
.msg.ai::before{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9) 0,transparent 35%),radial-gradient(circle,var(--o1),var(--o2) 80%);border-radius:50%;width:24px;height:24px;left:-32px}
@media (prefers-reduced-motion:reduce){.eco,.eco i{animation:none!important}}
</style>
</head>

const MODEL_STORE="vc-models-3",CFG_STORE="vc-cfg";

/* chiede a Google quali modelli può usare questa chiave: "flash" per ascoltare, "lite" per le cose veloci */
async function pickModels(key){
  if(PICKED.key===key&&PICKED.set)return PICKED.set;
  let r,d;prog("Controllo la chiave con Google…");
  try{r=await fetchT(`${GEMINI}?pageSize=200`,{headers:{"x-goog-api-key":key}},15000);d=await r.json().catch(()=>null)}catch(e){if(e&&e.code==="timeout")return FALLBACK_SET;throw e}
  if(!r.ok){const t=JSON.stringify(d||"");const det="elenco modelli "+r.status+": "+((d&&d.error&&d.error.message)||t).slice(0,200);
    if(/API key|API_KEY|PERMISSION|UNAUTHENTICATED/i.test(t)||r.status===401||r.status===403)throw {code:"bad_key",detail:det};
    return FALLBACK_SET}
  const names=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>String(m.name).replace(/^models\//,""));
  const gsize=n=>{const m=n.match(/(\d+)b/);return m?parseInt(m[1]):0};
  const gver=n=>parseFloat((n.match(/gemma-(\d+)/)||[0,0])[1]);
  const gemma=names.filter(n=>/^gemma/.test(n)&&/it/.test(n)&&!/nano|e\d+b/.test(n)).sort((a,b)=>(gver(b)-gver(a))||gsize(b)-gsize(a)).slice(0,1);
  const bad=/image|tts|live|audio|embedding|robotics|computer|native|nano|learnlm/;
  const ver=n=>{const m=n.match(/gemini-(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0};
  const score=n=>-(/preview|exp/.test(n)?15:0)+(/latest/.test(n)?8:0)+ver(n)*3;
  const gem=names.filter(n=>/^gemini/.test(n)&&!bad.test(n));
  const flash=gem.filter(n=>/flash/.test(n)&&!/lite/.test(n)).sort((a,b)=>score(b)-score(a)).slice(0,2);
  const lite=gem.filter(n=>/flash-lite/.test(n)).sort((a,b)=>score(b)-score(a)).slice(0,1);
  const set={flash:flash.length?flash:MODELS,lite,gemma};
  PICKED={key,set};return set;
}

function thinkOrder(m){
  if(/^gemma/.test(m))return ["none"];
  const all=/gemini-([3-9]|\d\d)|latest/.test(m)?["minimal","low","budget0","none"]:["budget0","none"];
  const known=CFG_OK[m];return known?[known].concat(all.filter(x=>x!==known)):all;
}
let lastErr="";
async function gemini(input,json,audio,key,tier){
  key=key||GKEY;if(!key)throw {code:"no_key"};
  let contents;
  if(Array.isArray(input))contents=input.slice(-24).map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:String(m.content||"").slice(0,8000)}]}));
  else contents=[{role:"user",parts:[{text:String(input||"").slice(0,20000)}]}];
  while(contents.length>1&&contents[0].role!=="user")contents.shift();
  contents=contents.reduce((acc,c)=>{const prev=acc[acc.length-1];if(prev&&prev.role===c.role)prev.parts.push(...c.parts);else acc.push(c);return acc},[]);
  if(audio){const last=contents[contents.length-1];
    last.parts.unshift({text:`Nota per l'ascolto: l'audio allegato è italiano parlato da un ragazzo delle Marche${S.dialetto?" ("+S.dialetto+")":""}, con DSA. A volte usa parole in dialetto, esita, ripete o lascia frasi a metà. Ascolta con molta attenzione tutto l'audio e trascrivi quello che dice davvero, parola per parola: non inventare parole che non senti e non correggerlo nella trascrizione. Se un pezzo non si capisce, scrivi […].`});
    last.parts.unshift({inline_data:{mime_type:audio.mime||"audio/wav",data:audio.data}})}
  let r;const errs=[];
  let set=(key===GKEY&&MODEL_SET&&MODEL_SET.flash)?MODEL_SET:null;
  if(!set){set=await pickModels(key);if(key===GKEY){MODEL_SET=set;try{localStorage.setItem(MODEL_STORE,JSON.stringify(set))}catch(e){}}}
  /* per ascoltare e per i ragionamenti lunghi prima "flash"; per tutto il resto prima "lite", che è più veloce */
  /* ascolto: prima Lite (più veloce), al massimo 2 modelli. Ragionamenti lunghi: prima Flash. Il resto: prima Lite */
  const list=audio?(S.precise?set.flash.concat(set.lite):set.lite.concat(set.flash)).slice(0,2):(tier==="complex"?set.flash.concat(set.lite):set.lite.concat(set.flash)).concat(set.gemma||[]);
  const kb=audio?Math.round(audio.data.length*0.75/1024):0,t0=Date.now();
  const tick=audio?setInterval(()=>prog("Il Cervello ascolta… "+Math.round((Date.now()-t0)/1000)+"s"),1000):null;
  try{
  let prepay=false;
  for(const model of list){
    const isGemma=/^gemma/.test(model);
    if(prepay&&!isGemma)continue;          /* con i crediti prepagati finiti, salta gli altri Gemini e prova Gemma */
    if(isGemma&&audio){errs.push(model+": non sente l'audio");lastErr=errs.join(" | ");continue}
    prog(audio?"Il Cervello ascolta…":"Il Cervello ci pensa…");
    for(const mode of thinkOrder(model)){
      const generationConfig={temperature:.7,maxOutputTokens:audio?700:1536};
      if(json&&!isGemma)generationConfig.responseMimeType="application/json";
      if(THINK[mode])generationConfig.thinkingConfig=THINK[mode];
      try{r=await fetchT(`${GEMINI}/${model}:generateContent`,{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":key},body:JSON.stringify({contents,generationConfig})},audio?45000:25000)}
      catch(e){if(e&&e.code==="timeout"){errs.push(model+" nessuna risposta in tempo");lastErr=errs.join(" | ");break}throw e}
      if(r.status===404){errs.push(model+" 404");lastErr=errs.join(" | ");break}
      const d=await r.json().catch(()=>null);
      if(r.status===400&&mode!=="none"&&!/API key|API_KEY/i.test(JSON.stringify(d||"")))continue;   /* impostazione non accettata: prova la prossima */
      if(r.status===429){errs.push(model+" 429");lastErr=errs.join(" | ");break}
      if(!r.ok){const t=JSON.stringify(d||"");errs.push(model+" "+r.status+": "+((d&&d.error&&d.error.message)||t).slice(0,160));lastErr=errs.join(" | ");if(r.status===402)prepay=true;if(/API key|API_KEY|PERMISSION|UNAUTHENTICATED/i.test(t)||r.status===403||r.status===401)throw {code:"bad_key",detail:lastErr};break}
      if(CFG_OK[model]!==mode){CFG_OK[model]=mode;try{localStorage.setItem(CFG_STORE,JSON.stringify(CFG_OK))}catch(e){}}
      const text=((d&&d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).map(p=>p.text||"").join("").trim();
      if(!audio&&key===GKEY)setAudioOk(!isGemma);
      if(!json)return {text,model};
      let parsed=null;try{parsed=JSON.parse(text)}catch(e){const m=text.match(/\{[\s\S]*\}/);if(m)try{parsed=JSON.parse(m[0])}catch(_){}}
      return {json:parsed,text,model};
    }
  }
  }finally{if(tick)clearInterval(tick)}
  if(audio)lastErr+=" | audio "+kb+" KB, "+(audio.secs?audio.secs.toFixed(1)+" s":"")+", attesa "+Math.round((Date.now()-t0)/1000)+" s";
  throw {code:/ 402/.test(lastErr)?"prepay":/ 429/.test(lastErr)?"rate_limited":"ai_error",detail:lastErr};
}

function weekStats(w){
  if(!S.goal)return {};const s=iso(Date.parse(S.goal.start)+w*7*864e5),e=iso(Date.parse(S.goal.start)+(w+1)*7*864e5);
  const g=S.games.filter(x=>x.d>=s&&x.d<e);const days=Object.keys(S.days).filter(d=>d>=s&&d<e).length;

function dueCards(){return S.dict.filter(x=>(x.due||today())<=today())}

function weight(g){

  const st=curStep(); if(st){ if(GAMES[g].cat===st.focus) w*=2.5; else if(st.focus==="dialogo"&&GAMES[g].cat==="parlare") w*=1.5; }

function wpick(list){const ws=list.map(weight),t=ws.reduce((a,b)=>a+b,0);let r=Math.random()*t;for(let i=0;i<list.length;i++){r-=ws[i];if(r<=0)return list[i]}return list[list.length-1]}

    try{const r=await sample.json(`Sei un logopedista gentile. Un ragazzo di 18 anni con DSA ha letto ad alta voce questa frase in italiano: "${c.join(" ")}". Ascolta l'audio allegato.
Rispondi SOLO con JSON {"sentito":"trascrizione fedele di quello che ha detto, con le esitazioni scritte come …","voto":2 se letta fluida e corretta, 1 se con qualche esitazione o parola cambiata, 0 se molto difficoltosa o se non ha letto la frase,"commento":"max 18 parole, concreto e incoraggiante, in italiano semplice"}`,{audio:a});
      if(gs!==my)return;
      gs.fb={r:Math.max(0,Math.min(2,Math.round(+r.voto)||0)),sentito:String(r.sentito||"…"),commento:String(r.commento||"")};
    }catch(e){if(gs!==my)return;toast(errMsg(e))}

};
function rateLeggi(r){
  const L=S.speak;L.log.push({d:today(),lvl:L.lvl,r});cap(L.log);gs.rs.push(r);gs.fb=null;
  if(r===2){L.ups++;if(L.ups>=3&&L.lvl<5){L.lvl++;L.ups=0;toast("Sali al livello "+L.lvl+"!")}}
  if(r===0){L.ups=0;S.chunky=true;if(L.lvl>1&&L.log.slice(-2).every(x=>x.r===0)){L.lvl--;toast("Torniamo al livello "+L.lvl+" per un po'.")}}
  gs.i++;gs.c=S.chunky?0:99;
  if(gs.i>=gs.q.length)finish(Math.round(gs.rs.reduce((a,b)=>a+b,0)/gs.rs.length));else{save();render()}
}

Rispondi SOLO con JSON {"sentito":"trascrizione fedele","voto":2 se ha raccontato in modo chiaro, 1 se con fatica o molte esitazioni, 0 se è riuscito a dire poco,"bene":"1 cosa fatta bene, max 15 parole","migliora":"riscrivi una sua frase in italiano più naturale, oppure dai 1 consiglio, max 22 parole"}`,{audio:a});
      if(gs!==my)return;
      gs.fb={r:Math.max(0,Math.min(2,Math.round(+r.voto)||0)),sentito:String(r.sentito||"…"),bene:String(r.bene||""),migliora:String(r.migliora||"")};

/* ---- Spiega senza dire ---- */
INIT.spiega=()=>{const pool=SPIEGA.concat(S.extra.spiega);gs={items:shuffle(pool).slice(0,2),i:0,t:45,phase:"ready",rs:[]}};
async function endSpiega(){
  const my=gs;if(!my)return;const it=gs.items[gs.i];
  if(!gs.rec){gs.phase="rate";render();return}
  gs.rec=false;gs.phase="wait";render();
  const a=await Rec.stop();
  if(gs!==my)return;
  if(!a||a.secs<1){gs.phase="rate";render();return}
  try{const r=await sample.json(`Gioco "spiega senza dire": un ragazzo spiega a voce, in italiano, una parola segreta senza dirla e senza usare le parole vietate (${it.no.join(", ")}). Ascolta l'audio allegato.
Prima prova a indovinare la parola SOLO da quello che senti. Poi confrontala con la parola segreta, che era "${it.w}".
Rispondi SOLO con JSON {"sentito":"trascrizione fedele","indovino":"la parola che hai indovinato ascoltando","giusta":true se la tua ipotesi è la parola segreta o un sinonimo stretto,"vietate_usate":["parole vietate che ha detto"],"detta_la_parola":true se ha detto la parola segreta,"commento":"max 15 parole, incoraggiante"}`,{audio:a});
    if(gs!==my)return;
    const clean=!(r.vietate_usate||[]).length&&!r.detta_la_parola;
    gs.res={sentito:String(r.sentito||"…"),indovino:String(r.indovino||"?"),giusta:!!r.giusta,vietate:(r.vietate_usate||[]).map(String),detta:!!r.detta_la_parola,commento:String(r.commento||""),r:r.giusta&&clean?2:(r.giusta||clean)?1:0};
    gs.phase="res";speak(gs.res.giusta?"È "+gs.res.indovino+"!":"Secondo me è "+gs.res.indovino+".");
  }catch(e){if(gs!==my)return;toast(errMsg(e));gs.phase="rate"}
  render();
}
RENDER.spiega=()=>{
  const it=gs.items[gs.i],v=hasVoice();
  app.innerHTML=head("Spiega senza dire",`Parola ${gs.i+1} di 2. ${v?"Spiegala a voce senza usare le parole vietate: il Cervello prova a indovinarla.":"Spiegala a voce come a un amico, in italiano, senza usare le parole vietate."}`)+`
  <div class="card"><div class="word">${esc(it.w)}</div><p class="small muted" style="text-align:center">Parole vietate</p><div class="forbid">${it.no.map(x=>`<span>${esc(x)}</span>`).join("")}</div>
  ${gs.phase==="ready"?`<button class="btn wide ${v?"mic":""}" id="go">${v?MIC_SVG+" ":""}Via! (45 secondi)</button>`
  :gs.phase==="run"?`<div class="tring ${gs.t<=10?"low":""}"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="tbg" cx="60" cy="60" r="52"/><circle class="tfg" cx="60" cy="60" r="52" style="stroke-dashoffset:${(326.7*(1-gs.t/45)).toFixed(1)}"/></svg><div class="timer ${gs.t<=10?"low":""}" aria-live="off">${gs.t}</div></div>${gs.rec?METER(7,true)+`<p class="small muted" style="text-align:center">Ti sto ascoltando…</p>`:""}<button class="btn soft wide" id="stop">Ho finito</button>`
  :gs.phase==="wait"?`<p><span class="spin"></span> Il Cervello ci pensa…</p>`
  :gs.phase==="res"?`<div class="heard"><p class="eyebrow">Il Cervello dice</p><p style="font-size:1.4rem;font-weight:600" class="${gs.res.giusta?"ok":"no"}">${esc(gs.res.indovino)}${gs.res.giusta?" — giusto!":""}</p>
      ${gs.res.vietate.length?`<p class="no small">Hai usato: ${gs.res.vietate.map(esc).join(", ")}</p>`:""}${gs.res.detta?`<p class="no small">Hai detto la parola segreta.</p>`:""}
      <p class="small">${esc(gs.res.commento)}</p><p class="small muted">Ho sentito: ${esc(gs.res.sentito)}</p></div><button class="btn wide" id="cont">Avanti</button>`
  :`<p class="small muted">Com'è andata?</p>${rateHTML("Difficile","Così così","Bene")}`}</div>${boredBtn()}`;
  const g=app.querySelector("#go");if(g)g.onclick=async()=>{
    if(v){try{stopSpeak();await Rec.start();gs.rec=true}catch(e){gs.rec=false;toast(errMsg(e))}}
    gs.phase="run";render();
    timer=setInterval(()=>{gs.t--;const el=app.querySelector(".timer");if(el){el.textContent=gs.t;el.classList.toggle("low",gs.t<=10)}
      const fg=app.querySelector(".tfg"),ring=app.querySelector(".tring");if(fg)fg.style.strokeDashoffset=(326.7*(1-Math.max(0,gs.t)/45)).toFixed(1);if(ring)ring.classList.toggle("low",gs.t<=10);
      if(gs.t<=0){clearTimers();endSpiega()}},1000)};
  const s=app.querySelector("#stop");if(s)s.onclick=()=>{clearTimers();endSpiega()};
  const next=r=>{gs.rs.push(r);gs.i++;if(gs.i>=gs.items.length)finish(Math.round(gs.rs.reduce((a,c)=>a+c,0)/gs.rs.length));else{gs.t=45;gs.phase="ready";gs.res=null;render()}};
  app.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>next(+b.dataset.r));
  const ct=app.querySelector("#cont");if(ct)ct.onclick=()=>next(gs.res.r);
};

/* ---- Sequenze (memoria) ---- */
function memRound(){const n=S.mem.span,words=S.mem.mode==="parole";
  const seq=words?shuffle(PAROLE).slice(0,n):Array.from({length:n},()=>String(Math.floor(Math.random()*10)));
  const opts=words?shuffle(seq.concat(shuffle(PAROLE.filter(w=>!seq.includes(w))).slice(0,Math.min(4,Math.ceil(n/2))))):["1","2","3","4","5","6","7","8","9","0"];
  return {seq,opts,ans:[],used:[],k:-1,phase:"intro"}}
INIT.sequenze=()=>{gs={round:0,res:[],...memRound()}};
function memTick(){gs.k++;if(gs.k>=gs.seq.length){gs.phase="answer";render();return}render();
  timer=setTimeout(()=>{const el=app.querySelector(".flash");if(el)el.textContent="";timer=setTimeout(memTick,300)},S.mem.mode==="parole"?1500:1100)}
RENDER.sequenze=()=>{
  const M=S.mem, sub=`Sequenza ${gs.round+1} di 3 · lunghezza ${gs.seq.length}`;
  if(gs.phase==="intro"){
    app.innerHTML=head("Sequenze",sub)+`<div class="card"><div class="seg" role="group" aria-label="Tipo"><button data-m="parole" aria-pressed="${M.mode==="parole"}">Parole</button><button data-m="numeri" aria-pressed="${M.mode==="numeri"}">Numeri</button></div>
    <p class="small muted">${M.mode==="parole"?"Trucco: immagina una piccola scena con le parole, una dopo l'altra.":"Trucco: raggruppa le cifre a due a due, 4 7 1 9 diventa 47 e 19."}</p>
    <button class="btn wide" id="go">Guarda</button></div>${boredBtn()}`;
    app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{M.mode=b.dataset.m;save();Object.assign(gs,memRound());render()});
    app.querySelector("#go").onclick=()=>{gs.phase="show";memTick()};return;
  }
  if(gs.phase==="show"){app.innerHTML=head("Guarda e ricorda",sub)+`<div class="card"><div class="flash" aria-live="polite">${esc(gs.seq[gs.k])}</div><div class="dots">${gs.seq.map((_,i)=>`<i class="${i<=gs.k?"on":""}"></i>`).join("")}</div></div>`;return}
  if(gs.phase==="answer"){
    app.innerHTML=head("Rimettile in ordine",sub)+`<div class="card"><div class="answer" aria-live="polite">${gs.ans.map(a=>`<span>${esc(a)}</span>`).join("")||'<span class="muted small" style="background:none">Tocca nell\'ordine giusto</span>'}</div>
    <div class="tiles">${gs.opts.map((o,i)=>`<button data-o="${i}" class="${gs.used.includes(i)&&M.mode==="parole"?"used":""}">${esc(o)}</button>`).join("")}</div>
    <div class="two"><button class="btn ghost" id="undo" ${gs.ans.length?"":"disabled"}>Annulla</button><button class="btn" id="chk" ${gs.ans.length===gs.seq.length?"":"disabled"}>Controlla</button></div></div>`;
    app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const i=+b.dataset.o;if(gs.ans.length>=gs.seq.length)return;if(M.mode==="parole"&&gs.used.includes(i))return;gs.ans.push(gs.opts[i]);gs.used.push(i);render()});
    app.querySelector("#undo").onclick=()=>{gs.ans.pop();gs.used.pop();render()};
    app.querySelector("#chk").onclick=()=>{
      const ok=gs.ans.join("|")===gs.seq.join("|");M.log.push({d:today(),span:M.span,ok,mode:M.mode});cap(M.log);gs.note="";
      if(ok){M.ok++;if(M.ok>=2){M.span=Math.min(9,M.span+1);M.ok=0;gs.note="Sequenza più lunga: ora "+M.span+"."}M.best=Math.max(M.best,M.span)}
      else{M.ok=0;if(M.log.slice(-2).every(x=>!x.ok)&&M.span>2){M.span--;gs.note="Torno a "+M.span+" per consolidare."}}
      gs.res.push(ok);gs.ok=ok;gs.phase="fb";save();render()};
    return;
  }
  app.innerHTML=head(gs.ok?"Giusto!":"Quasi",sub)+`<div class="card">${gs.ok?"":`<p>L'ordine era: <b>${gs.seq.map(esc).join(" · ")}</b></p>`}${gs.note?`<p class="note">${esc(gs.note)}</p>`:""}
  <button class="btn wide" id="mn">${gs.round>=2?"Fine":"Prossima"}</button></div>`;
  app.querySelector("#mn").onclick=()=>{if(gs.round>=2){const g=gs.res.filter(Boolean).length;finish(g===3?2:g?1:0);return}const r=gs.round+1,res=gs.res;Object.assign(gs,memRound(),{round:r,res,phase:"show"});memTick()};
};

    if(gs.i>=gs.cards.length)finish(gs.ok===gs.cards.length?2:gs.ok?1:0);else render()};
  const y=app.querySelector("#y");if(y)y.onclick=()=>step(true);
  const n=app.querySelector("#n");if(n)n.onclick=()=>step(false);
};

/* ricampiona a 16 kHz con il filtro dell'iPhone (OfflineAudioContext); se non c'è, media mobile */
async function resampleTo(all,rate,target){

  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;

    const outLen=Math.ceil(all.length*target/rate),oc=new OAC(1,outLen,target);

    const src=oc.createBufferSource();src.buffer=b;src.connect(oc.destination);src.start(0);
    const out=await Promise.race([oc.startRendering(),new Promise((_,rej)=>setTimeout(()=>rej("lento"),4000))]);
    return out.getChannelData(0).slice(0);
  }catch(e){}}
  const ratio=rate/target,n=Math.floor(all.length/ratio),y=new Float32Array(n);

}
/* alza il volume se hai parlato piano e toglie i silenzi all'inizio e alla fine */
function cleanVoice(x,rate){
  let peak=0;for(let i=0;i<x.length;i++){const a=Math.abs(x[i]);if(a>peak)peak=a}
  if(peak<0.002)return x;
  const th=peak*0.06,pad=Math.floor(rate*0.25);let a=0,b=x.length-1;
  while(a<x.length&&Math.abs(x[a])<th)a++;while(b>a&&Math.abs(x[b])<th)b--;

  const g=peak<0.7?Math.min(0.9/peak,8):1;if(g!==1)for(let i=0;i<y.length;i++)y[i]*=g;
  return y;
}

${hist}
Uso dell'app per settimana:
${stats}
Ragiona su cosa funziona e cosa no, collegando l'uso dell'app a come va nella vita vera. Poi decidi la settimana ${nextIdx+1}: tienila uguale se funziona, rendila più facile se è andata male o si è annoiato, più impegnativa se è andata bene. Focus possibili: parlare, parole, memoria, dialogo, studio.
Rispondi SOLO con JSON: {"analisi":"max 45 parole, tono da amico, concreto, dati alla mano","cambio":"max 25 parole: cosa cambia la prossima settimana e perché, oppure stringa vuota","prossima":{"titolo":"max 5 parole","focus":"...","scena":"una scena di conversazione realistica","missione":"una missione concreta per la vita vera","perche":"max 25 parole"}}`,{modelTier:"complex",cache:false});
    const st=cleanStep(r.prossima,nextIdx);

  <div id="res"></div><div id="manual"></div>
  <div class="card"><div class="row between"><h2>Le mie frasi</h2><span class="muted small">${S.dict.filter(x=>x.kind!=="studio").length}</span></div>
  ${S.dict.some(x=>x.kind!=="studio")?`<div class="dict">${S.dict.map((x,i)=>[x,i]).filter(([x])=>x.kind!=="studio").reverse().map(([x,i])=>`<div class="item"><div><div>${esc(x.it)}</div><div class="d">${x.dial?esc(x.dial)+" · ":""}prossimo ripasso ${x.due<=today()?"oggi":new Date(x.due).toLocaleDateString("it-IT",{day:"numeric",month:"short"})}</div></div><button class="x" data-del="${i}">Elimina</button></div>`).join("")}</div>`
  :`<p class="muted small">Ancora vuoto.</p>`}</div>`;
  const tr=app.querySelector("#tr"),msg=app.querySelector("#trmsg"),res=app.querySelector("#res");
  app.querySelector("#dname").onchange=e=>{S.dialetto=e.target.value.trim();save()};
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.dict.splice(+b.dataset.del,1);save();render()});
  if(sampleChecked&&!sample){tr.disabled=true;msg.hidden=false;msg.textContent="Il Cervello non è ancora collegato. Puoi scrivere tu l'italiano qui sotto.";
    app.querySelector("#manual").innerHTML=`<div class="card"><label for="mit">Versione in italiano</label><input id="mit" maxlength="300"><button class="btn soft wide" id="msave">Salva nel ripasso</button></div>`;
    app.querySelector("#msave").onclick=()=>{const it=app.querySelector("#mit").value.trim();if(!it)return;addCard(app.querySelector("#dtxt").value.trim(),it,autoChunk(it));save();render()}}
  const showRes=()=>{if(!dRes)return;
    res.innerHTML=`<div class="card result"><p class="eyebrow">In italiano</p><p class="it">${dRes.pezzi.map(esc).join(' <span class="sep">/</span> ')}</p>
    ${dRes.parole.map(p=>`<div class="pair"><span class="muted">${esc(p.dialetto)}</span><span>→</span><span>${esc(p.italiano)}</span></div>`).join("")}
    ${dRes.consiglio?`<p class="small muted">${esc(dRes.consiglio)}</p>`:""}
    <button class="btn soft wide" id="keep" ${dRes.saved?"disabled":""}>${dRes.saved?"Salvata nel ripasso":"Salva nel ripasso"}</button></div>`;
    res.querySelector("#keep").onclick=()=>{addCard(dRes.src,dRes.italiano,dRes.pezzi);dRes.saved=true;save();render()}};
  showRes();
  const rd=app.querySelector("#recd");if(rd)rd.onclick=()=>toggleRec(rd,async a=>{
    const dn=app.querySelector("#dname").value.trim();msg.hidden=false;msg.innerHTML='<span class="spin"></span> Ti ascolto e ci penso…';
    try{const r=await sample.json(`Un ragazzo di 18 anni con DSA ha detto a voce una frase, spesso in dialetto${dn?" ("+dn+")":""} o mischiando dialetto e italiano. Ascolta l'audio allegato.
In "sentito" scrivi la trascrizione fedele di quello che ha detto, anche le parole in dialetto. Poi trasformala in italiano parlato, corretto e naturale (non troppo formale), mantenendo il significato. Dividi la frase italiana in pezzi da 2-5 parole secondo le pause del respiro. Elenca al massimo 4 parole o espressioni dialettali o sbagliate con la forma italiana. Aggiungi un consiglio breve (max 15 parole) e incoraggiante, oppure stringa vuota.
Rispondi SOLO con JSON: {"sentito":"...","italiano":"...","pezzi":["..."],"parole":[{"dialetto":"...","italiano":"..."}],"consiglio":"..."}`,{audio:a});
      const it=String(r&&r.italiano||"").trim();if(!it)throw {};
      dRes={src:String(r.sentito||""),italiano:it,pezzi:Array.isArray(r.pezzi)&&r.pezzi.length?r.pezzi.map(String):autoChunk(it),parole:(r.parole||[]).filter(p=>p&&p.dialetto&&p.italiano).slice(0,4),consiglio:String(r.consiglio||"")};
      msg.hidden=true;speak(it);render();
    }catch(e){toast(errMsg(e));render()}
  },30);
  tr.onclick=async()=>{const t=app.querySelector("#dtxt").value.trim();if(!t||!sample)return;
    const dn=app.querySelector("#dname").value.trim();if(dn!==S.dialetto){S.dialetto=dn;save()}
    tr.disabled=true;msg.hidden=false;msg.innerHTML='<span class="spin"></span> Ci penso…';
    try{const r=await sample.json(`Un ragazzo di 18 anni con DSA scrive frasi come le direbbe a voce, spesso in dialetto${dn?" ("+dn+")":""} o mischiando dialetto e italiano. Trasforma la frase in italiano parlato, corretto e naturale (non troppo formale), mantenendo il significato. Dividi la frase italiana in pezzi da 2-5 parole secondo le pause del respiro. Elenca al massimo 4 parole o espressioni dialettali o sbagliate con la forma italiana. Aggiungi un consiglio breve (max 15 parole) e incoraggiante sul ritmo o sulla pronuncia, oppure stringa vuota. Frase: """${t}"""
Rispondi SOLO con JSON: {"italiano":"...","pezzi":["..."],"parole":[{"dialetto":"...","italiano":"..."}],"consiglio":"..."}`,{modelTier:"quick"});
      const it=String(r&&r.italiano||"").trim();if(!it)throw{};
      dRes={src:t,italiano:it,pezzi:Array.isArray(r.pezzi)&&r.pezzi.length?r.pezzi.map(String):autoChunk(it),parole:(r.parole||[]).filter(p=>p&&p.dialetto&&p.italiano).slice(0,4),consiglio:String(r.consiglio||"")};
      msg.hidden=true;tr.disabled=false;showRes()}
    catch(e){tr.disabled=false;msg.textContent=noClaudeMsg(e)}};
}

/* ================= CERVELLO ================= */
let chatBusy=false;
function rCervello(){
  const off=sampleChecked&&!sample;
  app.innerHTML=`<div class="hero">${eco(chatBusy?"think":"idle")}<div class="hello"><p class="eyebrow">Il Cervello</p><h1>Il Cervello</h1><p class="say">Il tuo allenatore. Chiedimi quello che vuoi, anche in dialetto.</p></div></div>
  <p class="muted">Il Cervello ti ascolta e ragiona con l'intelligenza artificiale. Guarda come vai, crea esercizi sui tuoi interessi e ti aiuta a trovare il metodo giusto anche per studiare.</p>
  ${off?`<p class="note">Il Cervello non è ancora collegato: aggiungi la chiave Gemini in Impostazioni, qui sotto. Gli altri giochi funzionano lo stesso.</p>`:""}
  ${goalCervelloHTML()}
  ${voiceCardHTML(curStep()?curStep().scena:"una conversazione tra amici su cosa ho fatto oggi")}
  <div class="card"><h2>Cosa ti piace?</h2><p class="small muted">Più è preciso, più gli esercizi saranno tuoi.</p>
    <textarea id="int" maxlength="300" placeholder="es. Minecraft, video e montaggio, calcio, la festa del paese…">${esc(S.interessi)}</textarea>
    <button class="btn wide" id="gen" ${off?"disabled":""}>Crea esercizi nuovi su questi argomenti</button><p id="genmsg" class="small muted" hidden></p></div>
  <div class="card"><h2>Chiedi al Cervello</h2>
    <div class="chips">${["Ho una verifica, come studio?","Spiegami un argomento in modo semplice","Mi annoio subito, cosa faccio?","Aiutami a preparare cosa dire"].map(x=>`<button data-chip="${esc(x)}">${esc(x)}</button>`).join("")}</div>
    <div class="chat" id="chat">${S.chat.map(m=>`<div class="msg ${m.role==="user"?"me":"ai"}">${esc(m.content)}</div>`).join("")}</div>
    <textarea id="q" maxlength="800" placeholder="Scrivi qui, anche in dialetto…"></textarea>
    <div class="two"><button class="btn" id="send" ${off?"disabled":""}>Invia</button><button class="btn ghost" id="clr" ${S.chat.length?"":"disabled"}>Nuova chat</button></div></div>
  ${settingsHTML()}
  <details><summary>Come funziona l'app (i metodi)</summary><ul>
    <li><b>Ricordare invece di rileggere.</b> Ogni gioco ti fa tirare fuori la risposta dalla testa: è il metodo di studio con più prove scientifiche.</li>
    <li><b>Ripasso distanziato.</b> Le tue frasi tornano dopo 1, 3, 7, 14 e 30 giorni, così passano nella memoria lunga.</li>
    <li><b>Giochi mescolati.</b> Il percorso alterna parlare, parole e memoria: mescolare aiuta a imparare e a non annoiarsi.</li>
    <li><b>La rete delle parole.</b> Ragnatela e Indovina allenano a ritrovare la parola giusta, come fanno i logopedisti.</li>
    <li><b>Scegli tu.</b> Puoi cambiare ogni gioco e dire quando ti annoi: l'app impara cosa funziona per te.</li>
    <li><b>Il tuo obiettivo guida tutto.</b> Il percorso settimanale sceglie più spesso i giochi utili per quella settimana, e la scena e la missione sono legate a quello che vuoi ottenere.</li>
    <li><b>Si misura la vita vera.</b> Ogni settimana dici com'è andata parlando con le persone. Il Cervello confronta questo con come hai usato l'app e corregge la settimana dopo.</li>
    <li><b>Vita vera.</b> La missione del giorno porta l'allenamento fuori dal telefono, dove serve.</li></ul></details>`;
  wireGoalCervello();wireVoice();wireSettings();
  app.querySelector("#int").onchange=e=>{S.interessi=e.target.value.trim();save()};
  app.querySelectorAll("[data-chip]").forEach(b=>b.onclick=()=>{const q=app.querySelector("#q");q.value=b.dataset.chip;q.focus()});
  app.querySelector("#clr").onclick=()=>{S.chat=[];save();render()};
  const gb=app.querySelector("#gen"),gm=app.querySelector("#genmsg");
  gb.onclick=async()=>{if(!sample)return;S.interessi=app.querySelector("#int").value.trim();save();
    gb.disabled=true;gm.hidden=false;gm.innerHTML='<span class="spin"></span> Preparo gli esercizi…';
    const len={1:"4-6 parole",2:"7-10 parole",3:"11-15 parole",4:"15-20 parole",5:"20-26 parole"}[S.speak.lvl];
    try{const r=await sample.json(`Sei un logopedista creativo. ${ctx()}
Crea esercizi in italiano parlato, corretto e naturale, legati ai suoi interessi (se non indicati, vita di tutti i giorni di un ragazzo):
- "frasi": 5 frasi da leggere a voce alta, ${len} ciascuna, divise in pezzi da 2-5 parole secondo le pause del respiro.
- "indovina": 3 parole comuni (una parola sola, minuscola), ognuna con 5 indizi brevi dal più vago al più preciso, senza mai contenere la parola.
- "spiega": 3 parole da spiegare a voce, ognuna con 2 parole vietate ovvie.
- "missione": 1 sfida piccola da fare oggi nella vita vera parlando in italiano con qualcuno, in una frase.
Rispondi SOLO con JSON: {"frasi":[{"pezzi":["..."]}],"indovina":[{"w":"...","c":["..."]}],"spiega":[{"w":"...","no":["...","..."]}],"missione":"..."}`,{modelTier:"default"});
      const E=S.extra;let n=0;
      (r.frasi||[]).forEach(f=>{if(Array.isArray(f.pezzi)&&f.pezzi.length){E.frasi.push({lvl:S.speak.lvl,pezzi:f.pezzi.map(String)});n++}});
      (r.indovina||[]).forEach(x=>{if(x&&x.w&&Array.isArray(x.c)&&x.c.length>=3){E.indovina.push({w:String(x.w),c:x.c.map(String).slice(0,5)});n++}});
      (r.spiega||[]).forEach(x=>{if(x&&x.w&&Array.isArray(x.no)){E.spiega.push({w:String(x.w),no:x.no.map(String).slice(0,2)});n++}});
      if(r.missione){E.missioni.push(String(r.missione));if(S.mission&&!S.mission.done)S.mission.text=String(r.missione)}
      cap(E.frasi,60);cap(E.indovina,40);cap(E.spiega,40);cap(E.missioni,20);save();
      gb.disabled=false;gm.textContent=`Fatto: ${n} esercizi nuovi aggiunti ai giochi${r.missione?" e una missione nuova per oggi":""}.`}
    catch(e){gb.disabled=false;gm.textContent=noClaudeMsg(e)}};
  const send=app.querySelector("#send");
  send.onclick=async()=>{const qEl=app.querySelector("#q"),q=qEl.value.trim();if(!q||!sample||chatBusy)return;
    chatBusy=true;send.disabled=true;S.chat.push({role:"user",content:q});cap(S.chat,20);qEl.value="";
    const chat=app.querySelector("#chat");chat.insertAdjacentHTML("beforeend",`<div class="msg me">${esc(q)}</div><div class="msg ai" id="live"><span class="spin"></span></div>`);
    const live=document.getElementById("live");live.scrollIntoView({block:"nearest"});
    const ecoEl=app.querySelector(".hero .eco");if(ecoEl)ecoEl.outerHTML=eco("think");
    const sys=`Sei il "Cervello", un allenatore di studio e di parola per questo ragazzo. ${ctx()}
Regole: rispondi in italiano semplice; frasi corte; massimo 120 parole salvo richiesta; usa elenchi numerati brevi quando spieghi passi; niente emoji; tono da amico, mai da professore. Se chiede come studiare, proponi metodi con prove scientifiche (ricordare a memoria con domande, ripasso distanziato, mappe, spiegare a voce) adattati a DSA e a chi si annoia: sessioni brevi, varietà, piccoli obiettivi. Se scrive in dialetto, rispondi in italiano e, se utile, mostragli come dirlo in italiano. Se parla di problemi di salute o di forte disagio, consiglia con gentilezza di parlarne con un medico o una persona di fiducia.`;
    let hist=S.chat.slice();while(hist.length&&hist[0].role!=="user")hist.shift();
    const msgs=hist.map((m,i)=>({role:m.role,content:i===0?sys+"\n\nMessaggio: "+m.content:m.content}));
    try{const r=await sample(msgs,{cache:false,onText:u=>{live.textContent=u.text}});
      S.chat.push({role:"assistant",content:r.text});cap(S.chat,20);save();live.removeAttribute("id")}
    catch(e){S.chat.pop();live.textContent=noClaudeMsg(e);live.removeAttribute("id");save()}
    chatBusy=false;send.disabled=false;const c=app.querySelector("#clr");if(c)c.disabled=!S.chat.length;
    const ecoEl2=app.querySelector(".hero .eco");if(ecoEl2)ecoEl2.outerHTML=eco("happy")};
}

/* ================= PROGRESSI ================= */
function goalProgHTML(){
  if(!S.goal||!S.goal.checkins.length) return `<div class="card"><h2>Nella vita vera</h2><p class="small muted">Qui vedrai come cambia, settimana dopo settimana, la facilità a parlare italiano con le persone. ${S.goal?"Il primo dato arriva dal controllo in Oggi.":"Prima scrivi il tuo obiettivo nel Cervello."}</p></div>`;
  const c=S.goal.checkins.slice(-8), first=S.goal.checkins[0].score, last=c[c.length-1].score, diff=last-first;
  return `<div class="card"><h2>Nella vita vera</h2><p class="muted small">Quanto ti viene facile parlare italiano con le persone, da 1 a 5</p>
    <div class="bars" style="grid-template-columns:repeat(${c.length},1fr);height:120px" role="img" aria-label="Facilità a parlare, ultime ${c.length} settimane">${c.map((x,i)=>`<div class="${i===c.length-1?"today":""}" style="height:${x.score/5*100}%;animation-delay:${i*60}ms"></div>`).join("")}</div>
    <div class="blabels" style="grid-template-columns:repeat(${c.length},1fr)">${c.map(x=>`<span>${x.week===0&&x===S.goal.checkins[0]?"Inizio":"Sett. "+x.week}</span>`).join("")}</div>
    <p>${S.goal.checkins.length<2?"Questo è il tuo punto di partenza.":diff>0?`Da quando hai iniziato sei salito di ${diff} ${diff===1?"punto":"punti"}.`:diff<0?"Ultimamente è più dura. Il Cervello ha adattato il percorso.":"Sei stabile rispetto all'inizio. I cambiamenti veri richiedono qualche settimana."}</p></div>`;
}
function rProg(){
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(iso(d))}
  const vals=days.map(d=>S.days[d]||0),mx=Math.max(3,...vals),p=prefs(),tot=S.games.filter(x=>!x.b).length;
  const boxes=[0,0,0,0,0];S.dict.forEach(x=>boxes[x.box||0]++);
  app.innerHTML=`<div class="hello"><p class="eyebrow">Progressi</p><h1>Come stai andando</h1></div>
  <div class="stats"><div class="stat"><b>${Math.floor(S.xp/100)+1}</b><span>livello (${S.xp} punti)</span></div><div class="stat"><b>${S.speak.lvl}/5</b><span>lettura a voce</span></div><div class="stat"><b>${S.mem.best}</b><span>sequenza più lunga</span></div></div>
  ${goalProgHTML()}
  <div class="card"><h2>Ultimi 14 giorni</h2><p class="muted small">Attività completate ogni giorno</p>
    <div class="bars" role="img" aria-label="Attività negli ultimi 14 giorni">${vals.map((v,i)=>`<div class="${v?"":"zero"} ${i===13?"today":""}" style="height:${v?Math.max(8,v/mx*100):2}%;animation-delay:${i*35}ms"></div>`).join("")}</div>
    <div class="blabels">${days.map(d=>`<span>${+d.slice(8)}</span>`).join("")}</div></div>
  <div class="card"><h2>Cosa ha capito l'app di te</h2>
    <p>${tot?`Hai completato ${tot} ${tot===1?"gioco":"giochi"}.`:"Ancora nessun gioco: inizia da Oggi."}</p>
    ${p.liked.length?`<p>Fai più spesso: <b>${p.liked.map(esc).join(", ")}</b>.</p>`:""}
    ${p.bored.length?`<p>Ti annoiano: <b>${p.bored.map(esc).join(", ")}</b>. Te li propongo meno.</p>`:""}
    ${S.dict.length?`<p>Frasi nel ripasso: ${S.dict.length}. Ben fissate (ricordate 3 o più volte): ${boxes[3]+boxes[4]}.</p>`:""}</div>
  <p class="small muted">I progressi sono salvati su questo telefono. Puoi farne un backup in Cervello > Impostazioni.</p>`;
}

if("scrollRestoration" in history)history.scrollRestoration="manual";

window.scrollTo(0,0);
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});
  let reloaded=false;const hadCtrl=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!hadCtrl||reloaded)return;if(Rec.on||tab==="play"){pendingReload=true;return}reloaded=true;location.reload()});}
